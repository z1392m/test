
name: Android Native SO Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download Android NDK r24
        run: |
          curl -fL --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r24-linux.zip \
            -o ndk.zip

          echo "eceb18f147282eb93615eff1ad84a9d3962fbb31  ndk.zip" | sha1sum -c -

          unzip -q ndk.zip -d "$RUNNER_TEMP"
          rm -f ndk.zip

          echo "NDK_HOME=$RUNNER_TEMP/android-ndk-r24" >> "$GITHUB_ENV"

      - name: Verify Android NDK
        run: |
          chmod +x "$NDK_HOME/ndk-build"
          cat "$NDK_HOME/source.properties"
          "$NDK_HOME/ndk-build" --version

      - name: Compile shared libraries
        run: |
          JNI="$GITHUB_WORKSPACE/app/src/main/jni"

          "$NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH=null \
            APP_BUILD_SCRIPT="$JNI/Build/Android.mk" \
            NDK_APPLICATION_MK="$JNI/Build/Application.mk" \
            APP_PLATFORM=android-24 \
            APP_ABI="arm64-v8a armeabi-v7a" \
            APP_OPTIM=release \
            NDK_OUT="$GITHUB_WORKSPACE/obj" \
            NDK_LIBS_OUT="$GITHUB_WORKSPACE/libs" \
            -j"$(nproc)"

      - name: Verify output
        run: |
          find libs -type f -name "*.so" -exec file {} \;
          test -f libs/arm64-v8a/libModMenu.so
          test -f libs/arm64-v8a/libLoader.so
          test -f libs/armeabi-v7a/libModMenu.so
          test -f libs/armeabi-v7a/libLoader.so

      - name: Upload ARM64 libraries
        uses: actions/upload-artifact@v4
        with:
          name: Native-Libraries-ARM64
          path: libs/arm64-v8a/*.so
          if-no-files-found: error

      - name: Upload ARM32 libraries
        uses: actions/upload-artifact@v4
        with:
          name: Native-Libraries-ARM32
          path: libs/armeabi-v7a/*.so
          if-no-files-found: error
