
name: Android Native SO Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      NDK_VERSION: "24.0.8215888"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"

      - name: Compile shared libraries
        run: |
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          JNI="$GITHUB_WORKSPACE/app/src/main/jni"

          chmod +x "$NDK/ndk-build"

          "$NDK/ndk-build" \
            NDK_PROJECT_PATH=null \
            APP_BUILD_SCRIPT="$JNI/Build/Android.mk" \
            NDK_APPLICATION_MK="$JNI/Build/Application.mk" \
            APP_PLATFORM=android-24 \
            APP_ABI="arm64-v8a armeabi-v7a" \
            APP_OPTIM=release \
            NDK_OUT="$GITHUB_WORKSPACE/obj" \
            NDK_LIBS_OUT="$GITHUB_WORKSPACE/libs" \
            -j"$(nproc)"

      - name: Verify compiled libraries
        run: |
          find libs -type f -name "*.so" -exec file {} \;
          test -f libs/arm64-v8a/libModMenu.so
          test -f libs/arm64-v8a/libLoader.so
          test -f libs/armeabi-v7a/libModMenu.so
          test -f libs/armeabi-v7a/libLoader.so

      - name: Upload ARM64
        uses: actions/upload-artifact@v4
        with:
          name: Native-Libraries-ARM64
          path: libs/arm64-v8a/*.so
          if-no-files-found: error

      - name: Upload ARM32
        uses: actions/upload-artifact@v4
        with:
          name: Native-Libraries-ARM32
          path: libs/armeabi-v7a/*.so
          if-no-files-found: error
          
